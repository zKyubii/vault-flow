# Development extras. Docker Compose loads this file BY ITSELF when you run
# `docker compose up` without naming the files, so locally you do not have to
# do anything.
#
# In production the files are named explicitly and this one stays out:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    # In development, on every interface: handy for opening the dashboard from
    # a phone on the home network while working.
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # the source comes from the host: edit a .py and uvicorn reloads,
      # no image rebuild needed
      - ./app:/code/app
      - ./db:/code/db
      # tests run inside the container, where every dependency is present:
      #   docker compose exec app python -m pytest tests/ -q
      - ./tests:/code/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # To inspect the database with a GUI client, uncomment:
  # db:
  #   ports:
  #     - "127.0.0.1:3307:3306"
