# Base configuration, valid for both development and production.
#
# The development extras (source mounted from the host, auto-reload) are NOT
# here: they live in docker-compose.override.yml, which Docker Compose loads
# by itself locally. In production the files are passed explicitly and the
# override stays out:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Why this way and not with a `volumes: []` in the production file: Compose
# **merges** lists instead of replacing them, so emptying the volumes from an
# override does not work — the host source would stay mounted over the image
# in production too. The same applies to `ports`, which is why neither is
# defined here.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # No port published: the database is reachable ONLY from the app
    # container, over Docker's internal network. To inspect it with a GUI
    # client, uncomment the block in docker-compose.override.yml.

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # NO `ports` here: publishing differs between development and production
    # and belongs in the respective override files.
    #
    # Compose **merges** lists instead of replacing them: putting a mapping
    # here would make the production one (`127.0.0.1:...`) add to it rather
    # than replace it, leaving the app published on 0.0.0.0 as well — exposed
    # to the internet, exactly what the production file is meant to prevent.
    # The two mappings would also fight over the same port and the container
    # would fail to start.

volumes:
  db_data:
