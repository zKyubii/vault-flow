<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c10">
  <title>Vault Flow</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- iOS ignores SVG here: without a PNG the home-screen tile comes out blank.
       The file is deliberately square — iOS rounds it itself. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <!-- Opens without Safari's chrome once added to the home screen. The manifest
       says the same thing, but iOS only honours it from 16.4 onwards. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vault Flow">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Background: faded grid and two glows. Fixed and not clickable, they sit
       behind everything and never enter the content flow. -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow one" aria-hidden="true"></div>
  <div class="bg-glow two" aria-hidden="true"></div>

  <div id="offline-bar" class="offline-bar" hidden>
    You are offline — showing the last data downloaded
  </div>

  <header class="topbar">
    <h1 id="page-title">Summary</h1>
    <div id="page-actions" class="topbar-actions"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="/">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Summary</span>
    </a>
    <a href="#/transactions" data-tab="/transactions">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Transactions</span>
    </a>
    <a href="#/add" data-tab="/add" class="tab-primary">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add</span>
    </a>
    <a href="#/import" data-tab="/import">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 19h16"/></svg>
      <span>Import</span>
    </a>
    <a href="#/rules" data-tab="/rules">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="17" r="2"/></svg>
      <span>Rules</span>
    </a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
