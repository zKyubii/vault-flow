# Production override.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Naming the files explicitly keeps docker-compose.override.yml (the
# development extras: host-mounted source, auto-reload) out of the picture.
# What runs is exactly what was built into the image.

services:
  db:
    restart: always

  app:
    restart: always
    ports:
      # Bound to 127.0.0.1: from outside, this port does not exist.
      #
      # With Tailscale it is `tailscale serve` that publishes it, and only to
      # your own devices: there is no login page on the public internet for
      # anyone to hammer. With a public domain the reverse proxy reaches it,
      # again from localhost.
      #
      # With the default binding (0.0.0.0) the dashboard would be reachable in
      # the clear by anyone who knows the server's IP, password prompt and all.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    # --proxy-headers: behind the reverse proxy, without this uvicorn sees
    # every request as http and as coming from the proxy.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
